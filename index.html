<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adv Anmol Narnaware</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Libre+Franklin:wght@500;600&display=swap">
<style>
:root{--bg:#0d1014;--fg:#f3efe8;--mute:rgba(243,239,232,.68);--line:rgba(243,239,232,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1014;--fg:#f3efe8}}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;overflow:hidden}
#stage{position:relative;height:100%;width:100%;outline:none;touch-action:pan-y}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .5s}
canvas.on{opacity:1}
.shade{position:absolute;inset:auto 0 0 0;height:60%;background:linear-gradient(to bottom,transparent,rgba(5,7,10,.72));pointer-events:none}
.cap{position:absolute;left:clamp(1.25rem,5vw,4rem);bottom:clamp(6.5rem,16vh,9rem);max-width:min(34rem,86vw);z-index:5}
.cap h1{margin:0;font-weight:500;font-size:clamp(1.8rem,3.8vw,3.1rem);line-height:1.1;letter-spacing:-.01em;transition:opacity .45s}
.firm{position:absolute;z-index:6;top:calc(env(safe-area-inset-top,0px) + 1rem);left:clamp(1.25rem,5vw,4rem);max-width:min(78vw,60rem);font-size:clamp(2.6rem,9vw,7.5rem);line-height:.95;letter-spacing:-.01em;font-weight:600;text-shadow:0 2px 24px rgba(0,0,0,.35)}
.book{display:inline-block;margin-top:1.4rem;padding:.9rem 1.6rem;border-radius:999px;background:var(--fg);color:#0d1014;font:600 .95rem/1 "Libre Franklin",Helvetica,Arial,sans-serif;letter-spacing:.03em;text-decoration:none;transition:transform .2s,background .2s}
.book:hover{transform:translateY(-2px);background:#fff}
.adv{display:block;margin-top:.55rem;font-size:clamp(1.15rem,2.6vw,1.9rem);font-weight:500;letter-spacing:.05em;line-height:1.2;color:var(--mute)}
.cap p{margin:.9rem 0 0;font-size:clamp(1.15rem,1.8vw,1.4rem);line-height:1.5;color:var(--mute);transition:opacity .45s}
.cap.out h1,.cap.out p{opacity:0}
.strip{position:absolute;left:0;right:0;bottom:clamp(1.25rem,4vh,2.25rem);display:flex;gap:.6rem;z-index:6;padding:0 1rem;overflow-x:auto}
.strip button{flex:none;width:76px;height:48px;padding:0;border:2px solid transparent;border-radius:4px;overflow:hidden;background:none;cursor:pointer;opacity:.55;transition:opacity .2s,border-color .2s}
.strip button:hover{opacity:.9}
.strip button[aria-current="true"]{border-color:var(--fg);opacity:1}
.strip img{display:block;width:100%;height:100%;object-fit:cover}
.arrow{position:absolute;top:50%;z-index:6;width:46px;height:46px;margin-top:-23px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--fg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer;display:flex;align-items:center;justify-content:center}
.arrow:hover{background:rgba(255,255,255,.25)}
.arrow.l{left:clamp(.75rem,3vw,2rem)}.arrow.r{right:clamp(.75rem,3vw,2rem)}
button:focus-visible,#stage:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.count{position:absolute;top:calc(env(safe-area-inset-top,0px) + 1.25rem);right:clamp(1.25rem,5vw,4rem);z-index:6;font:500 .9rem "Libre Franklin",Helvetica,Arial,sans-serif;color:var(--mute);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.strip button:first-child{margin-left:auto}.strip button:last-child{margin-right:auto}
@media (max-width:600px){.strip button{width:56px;height:36px}.arrow{top:44%;width:38px;height:38px;margin-top:-19px}.count{display:none}.firm{font-size:clamp(2.3rem,12.5vw,3.4rem);max-width:90vw}.adv{font-size:1.05rem}.cap{bottom:5.75rem;left:1.25rem;right:1.25rem;max-width:none}.cap h1{font-size:clamp(1.6rem,7vw,2rem)}.book{display:block;text-align:center;padding:1.05rem 1.2rem;margin-top:1.1rem}}
@media (max-height:520px){.cap p{display:none}.cap{bottom:1.25rem}.strip{display:none}.firm{font-size:clamp(1.8rem,6vw,3rem)}}
</style>
</head>
<body>
<main id="stage" tabindex="0" role="region" aria-roledescription="carousel" aria-label="Landscape gallery">
<canvas id="gl" aria-hidden="true"></canvas>
<div class="shade"></div>
<div class="count" id="count"></div>
<div class="firm" id="firm"><span id="fn">Anmis Legal Firm</span><span class="adv" id="adv">Adv Anmol Narnaware</span></div>
<div class="cap" id="cap"><h1 id="t"></h1><p id="d"></p><a class="book" id="book" href="tel:+91XXXXXXXXXX">Book an appointment</a></div>
<button class="arrow l" id="prev" aria-label="Previous landscape"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
<button class="arrow r" id="next" aria-label="Next landscape"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
<div class="strip" id="strip"></div>
<span class="sr" id="live" aria-live="polite"></span>
</main>
<script>
/* ==================== EDIT HERE ====================
   1) YOUR DETAILS (keep the quote marks) */
var FIRM_NAME="Anmis Legal Firm";
var ADVOCATE_NAME="Adv Anmol Narnaware";
var PHONE="+91XXXXXXXXXX";   /* with country code, no spaces */

/* 2) YOUR IMAGES, in slide order.
   To replace a photo, do either of these:
     a) Overwrite the file inside the "images" folder with your new photo
        using the same name (image1.jpg, image2.jpg ...), or
     b) Change the path below to your own file name.
   Use JPG or PNG. Leave a slot as "" to show a painted landscape instead. */
var image1="images/image1.jpg";
var image2="images/image2.jpg";
var image3="images/image3.jpg";
var image4="images/image4.jpg";
var image5="images/image5.jpg";
var IMAGES=[image1,image2,image3,image4,image5];
/* ===================================================== */
document.getElementById("fn").textContent=FIRM_NAME;
document.getElementById("adv").textContent=ADVOCATE_NAME;
document.getElementById("book").href="tel:"+PHONE.replace(/[^0-9+]/g,"");
document.title=ADVOCATE_NAME+" | "+FIRM_NAME;
(function(){
var SCENES=[
 {n:"High Court Lawyer",d:"Clear advice and firm representation, from first consultation to final judgment.",sky:["#1b2a52","#e58a64","#ffd9a0"],sun:[.68,.55,.07,"#fff1cf"],m:["#40476e","#2d3358","#1a1f3d","#0d1024"],stars:.5,s:3},
 {n:"A team behind every case",d:"Experienced advocates working together on your behalf.",sky:["#4f9ad8","#a9d6f0","#f6efd7"],sun:[.3,.2,.06,"#ffffff"],m:["#d6b27c","#c09459","#a8763f","#6e4a27"],stars:0,s:7},
 {n:"Prepared in every detail",d:"Careful research and sound strategy for every matter we take on.",sky:["#2e6f8f","#8ec5cf","#f2e4bd"],sun:[.5,.38,.05,"#fff8e1"],m:["#5d8296","#3c6074","#274758","#142b38"],stars:0,s:11},
 {n:"Standing by you",d:"Straight talk and steady support when it matters most.",sky:["#6a2340","#e8613a","#ffc26b"],sun:[.22,.6,.09,"#fff0c4"],m:["#a2452f","#74301f","#46201a","#1f0f12"],stars:0,s:19},
 {n:"Justice, delivered",d:"Practical solutions with the focus and discretion you deserve.",sky:["#050813","#10204a","#2c3f7a"],sun:[.74,.22,.035,"#f4f6ff"],m:["#5a6ea3","#2b3a69","#16204a","#080b1c"],stars:1,s:23}
];
function rnd(s){return function(){s=(s*16807)%2147483647;return s/2147483647}}
function paint(sc){
 var W=1600,H=1000,c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");
 var g=x.createLinearGradient(0,0,0,H*.75);g.addColorStop(0,sc.sky[0]);g.addColorStop(.6,sc.sky[1]);g.addColorStop(1,sc.sky[2]);x.fillStyle=g;x.fillRect(0,0,W,H);
 var r=rnd(sc.s);
 if(sc.stars){for(var i=0;i<260;i++){x.globalAlpha=.25+r()*.75*sc.stars;x.fillStyle="#fff";var q=r()*1.6+.3;x.fillRect(r()*W,r()*H*.55,q,q)}x.globalAlpha=1}
 var sx=sc.sun[0]*W,sy=sc.sun[1]*H,sr=sc.sun[2]*W;
 var rg=x.createRadialGradient(sx,sy,sr*.2,sx,sy,sr*7);rg.addColorStop(0,"rgba(255,244,214,.75)");rg.addColorStop(1,"rgba(255,244,214,0)");x.fillStyle=rg;x.fillRect(0,0,W,H);
 x.fillStyle=sc.sun[3];x.beginPath();x.arc(sx,sy,sr,0,7);x.fill();
 sc.m.forEach(function(col,k){
  var base=H*(.5+k*.12),amp=H*(.2-k*.035),p=[r()*6,r()*6,r()*6],f=[1.6+k*.5,3.9+k,9+k*2];
  x.fillStyle=col;x.beginPath();x.moveTo(0,H);
  for(var i=0;i<=W;i+=8){var u=i/W;var y=base-amp*(.55+.3*Math.sin(u*f[0]*6.28+p[0])+.15*Math.sin(u*f[1]*6.28+p[1])+.07*Math.sin(u*f[2]*6.28+p[2]));x.lineTo(i,y)}
  x.lineTo(W,H);x.closePath();x.fill();
  if(k===0){x.fillStyle="rgba(255,255,255,.12)";x.fillRect(0,base-amp*.2,W,3)}
 });
 return c}
var cv=SCENES.map(paint);var AS=cv.map(function(){return 1.6});
var el=function(i){return document.getElementById(i)};
var strip=el("strip");
SCENES.forEach(function(s,i){var b=document.createElement("button");b.type="button";b.setAttribute("aria-label","Show "+s.n);var im=new Image();im.alt="";im.src=cv[i].toDataURL("image/jpeg",.6);b.appendChild(im);b.onclick=function(){go(i)};strip.appendChild(b)});

var N=SCENES.length,active=0,reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,paused=false;
var canvas=el("gl"),failed=false;
var gl=canvas.getContext("webgl",{alpha:false,antialias:false});
var req=null,from=0,to=0,progress=1,startedAt=0,dir=1,U={};
var DUR=1600,SCALE=3.5,EDGE=.15,DRIFT=.5;

function setText(){
 var s=SCENES[active];
 var cap=el("cap");cap.classList.add("out");
 setTimeout(function(){el("t").textContent=s.n;el("d").textContent=s.d;cap.classList.remove("out")},reduced?0:350);
 el("count").textContent=(active+1)+" of "+N;el("live").textContent=s.n+", "+(active+1)+" of "+N;
 [].forEach.call(strip.children,function(b,i){b.setAttribute("aria-current",i===active)})}
function go(n){n=((n%N)+N)%N;if(n===active)return;req={from:active,to:n};active=n;setText()}
el("prev").onclick=function(){go(active-1)};el("next").onclick=function(){go(active+1)};
setText();el("t").textContent=SCENES[0].n;el("d").textContent=SCENES[0].d;

if(gl){try{
 var VS="attribute vec2 a;varying vec2 v;void main(){v=a*.5+.5;gl_Position=vec4(a,0.,1.);}";
 var FS="precision highp float;uniform sampler2D f,t;uniform float p,fa,ta,sc,d,e,dr;uniform vec2 res;varying vec2 v;"+
 "vec3 pm(vec3 x){return mod(((x*34.)+1.)*x,289.);}"+
 "float sn(vec2 v){const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;i=mod(i,289.);vec3 p=pm(pm(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);m=m*m;m=m*m;vec3 x=2.*fract(p*C.www)-1.;vec3 h=abs(x)-.5;vec3 ox=floor(x+.5);vec3 a0=x-ox;m*=1.79284291400159-.85373472095314*(a0*a0+h*h);vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;return 130.*dot(m,g);}"+
 "float fbm(vec2 v){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*sn(v);v*=2.;a*=.5;}return s;}"+
 "vec2 mir(vec2 u){return 1.-abs(1.-mod(u,2.));}"+
 "vec2 cov(vec2 u,float ia){float ca=res.x/res.y;vec2 s=(ca>ia)?vec2(1.,ia/ca):vec2(ca/ia,1.);return mir((u-.5)*s+.5);}"+
 "void main(){float adj=p*(1.+2.*e)-e;float n=fbm(v*sc+vec2(0.,p*d))*.5+.5;"+
 "n=smoothstep(0.,2.,length(texture2D(t,cov(v,ta)).rgb)+n);"+
 "float mf=1.-smoothstep(adj-e,adj+e,n);"+
 "vec2 fu=cov(v+vec2(0.,n*p*dr*d),fa);vec2 tu=cov(v+vec2(0.,n*(1.-p)*-.5*dr*d),ta);"+
 "gl_FragColor=mix(texture2D(f,fu),texture2D(t,tu),mf);}";
 function sh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}
 var pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);
 if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error("link");
 gl.useProgram(pr);
 var bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
 var loc=gl.getAttribLocation(pr,"a");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 ["f","t","p","fa","ta","sc","d","e","dr","res"].forEach(function(k){U[k]=gl.getUniformLocation(pr,k)});
 gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
 var tx=cv.map(function(c){var t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);return t});
 IMAGES.forEach(function(src,i){if(!src||i>=N)return;var im=new Image();im.crossOrigin="anonymous";im.onload=function(){try{gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.bindTexture(gl.TEXTURE_2D,tx[i]);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);AS[i]=im.naturalWidth/Math.max(im.naturalHeight,1);if(strip.children[i])strip.children[i].firstChild.src=src}catch(e){fallback()}};im.src=src});
 var resize=function(){var k=Math.min(devicePixelRatio||1,2),w=Math.round(canvas.clientWidth*k),h=Math.round(canvas.clientHeight*k);if(!w||!h||(canvas.width===w&&canvas.height===h))return;canvas.width=w;canvas.height=h;gl.viewport(0,0,w,h)};
 new ResizeObserver(resize).observe(canvas);resize();
 var ease=function(t){t=Math.min(Math.max(t,0),1);return t<.5?16*Math.pow(t,5):1-Math.pow(-2*t+2,5)/2};
 var frame=function(){if(fbOn)return;
  if(req){if(req.from!==req.to){from=req.from;to=req.to;progress=0;startedAt=performance.now();dir=((req.to-req.from+N)%N)*2<=N?1:-1}req=null}
  if(progress<1){var span=reduced?0:DUR;progress=span===0?1:ease((performance.now()-startedAt)/span)}
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tx[from]);gl.uniform1i(U.f,0);
  gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,tx[to]);gl.uniform1i(U.t,1);
  gl.uniform1f(U.p,progress);gl.uniform2f(U.res,canvas.width,canvas.height);
  gl.uniform1f(U.fa,AS[from]);gl.uniform1f(U.ta,AS[to]);gl.uniform1f(U.sc,SCALE);gl.uniform1f(U.d,dir);gl.uniform1f(U.e,EDGE);gl.uniform1f(U.dr,DRIFT);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);requestAnimationFrame(frame)};
 requestAnimationFrame(frame);canvas.classList.add("on");
}catch(err){failed=true}}else failed=true;

var fbOn=false;
function fallback(){ /* plain cross-fade, used if WebGL or the image files cannot be shaded (for example when opening index.html straight from a folder) */
 if(fbOn)return;fbOn=true;failed=true;var st=el("stage");canvas.remove();
 IMAGES.forEach(function(s,i){if(s&&strip.children[i])strip.children[i].firstChild.src=s});
 cv.forEach(function(c,i){var x=c;if(IMAGES[i]){x=new Image();x.src=IMAGES[i];x.alt=""}x.style.cssText="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .8s;opacity:"+(i===active?1:0);x.className="fb";st.insertBefore(x,st.firstChild)});
 var oldGo=go;go=function(n){oldGo(n);[].forEach.call(document.querySelectorAll(".fb"),function(c,i){c.style.opacity=i===active?1:0})}}
if(failed)fallback();

// autoplay, keyboard, swipe
setInterval(function(){if(!reduced&&!paused&&!document.hidden)go(active+1)},5200);
var stage=el("stage");
stage.onpointerenter=function(e){if(e.pointerType==="mouse")paused=true};stage.onpointerleave=function(){paused=false};stage.onfocus=function(){if(stage.matches(":focus-visible"))paused=true};stage.onblur=function(){paused=false};
stage.onkeydown=function(e){if(e.key==="ArrowLeft"){e.preventDefault();go(active-1)}else if(e.key==="ArrowRight"){e.preventDefault();go(active+1)}};
var sx=null;stage.onpointerdown=function(e){sx=e.clientX};
stage.onpointerup=function(e){if(sx===null)return;var dx=e.clientX-sx;sx=null;if(Math.abs(dx)>48)go(active+(dx<0?1:-1))};
})();
</script>
</body>
</html>
